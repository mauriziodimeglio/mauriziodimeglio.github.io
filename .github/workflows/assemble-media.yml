name: Assemble media binary
on:
  workflow_dispatch:
    inputs:
      stem:
        description: Staging folder name under media/_staging
        required: true
        type: string
      dest_path:
        description: Destination path for the decoded binary
        required: true
        type: string
      sha256:
        description: Expected SHA-256 of the decoded file
        required: true
        type: string
      message:
        description: Commit message
        required: true
        type: string
permissions:
  contents: write
jobs:
  assemble:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble, verify, commit, and clean up
        env:
          STEM: ${{ inputs.stem }}
          DEST: ${{ inputs.dest_path }}
          EXPECT: ${{ inputs.sha256 }}
          MSG: ${{ inputs.message }}
        run: |
          set -euo pipefail
          STDIR="media/_staging/${STEM}"
          mkdir -p "$(dirname "$DEST")"
          cat "$STDIR"/part_* | base64 -d > "$DEST"
          GOT=$(sha256sum "$DEST" | awk '{print $1}')
          if [ "$GOT" != "$EXPECT" ]; then
            echo "checksum mismatch: got $GOT expected $EXPECT"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git rm -r "$STDIR"
          git rm -f .github/workflows/assemble-media.yml
          git commit -m "$MSG"
          git push
